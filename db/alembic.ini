# Alembic is used to GENERATE versioned SQL from the SQLAlchemy models.
# The Supabase CLI APPLIES that SQL (the Sprites connector has no DDL path).
[alembic]
script_location = %(here)s/alembic
file_template = %%(rev)s_%%(slug)s
# Online URL is only for autogenerate/verification against a scratch local
# Postgres; override with CORNUCOPIA_MIGRATION_DB_URL. Never point it at prod.
sqlalchemy.url = postgresql+psycopg://postgres@localhost:54329/cornucopia_gen

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
