[project]
name = "cornucopia"
version = "0.1.0"
description = "CORNUCOPIA: autonomous resource compiler running on a Fly.io Sprite"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.165,<0.166",
  "uvicorn[standard]>=0.54,<0.55",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.6",
  "httpx>=0.29,<0.30",
  "sqlalchemy>=2.1,<2.2",
  "alembic>=1.20,<1.21",
  "networkx>=3.7,<3.8",
  "ortools>=9.15,<9.16",
  "langgraph>=1.2,<1.3",
  "langgraph-checkpoint>=4.3,<4.4",
]

[dependency-groups]
dev = [
  "pytest>=9.2",
  "pytest-asyncio>=1.0",
  "respx>=0.22",
  "ruff>=0.17",
  "mypy>=2.4",
  "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cornucopia"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["networkx", "networkx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
